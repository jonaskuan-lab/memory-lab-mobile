<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142d36"><title>Memory Lab｜每日記憶訓練</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#172e35;background:#f3f6f5}*{box-sizing:border-box}body{margin:0}header{background:#142d36;color:white;padding:24px 20px 26px}main{max-width:650px;margin:auto;padding:18px 16px 80px}h1{font-size:27px;margin:4px 0}h2{font-size:19px;margin:0 0 12px}p{line-height:1.6}.muted{color:#61747b;font-size:14px}.card{background:white;border:1px solid #dfe7e5;border-radius:18px;padding:19px;margin:0 0 15px;box-shadow:0 2px 9px #172e3510}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#eaf1ef;padding:13px 7px;border-radius:12px;text-align:center}.stat b{display:block;font-size:23px}.stat span{font-size:12px;color:#52686d}button,.btn{border:0;background:#176b68;color:white;padding:13px 16px;border-radius:11px;font-size:16px;font-weight:600;cursor:pointer}button.secondary{background:#e6efed;color:#174b4b}button:disabled{opacity:.5}input[type=text]{width:100%;padding:14px;border:1px solid #b8cac6;border-radius:10px;font-size:16px}nav{display:flex;gap:7px;margin:0 0 16px}nav button{flex:1;font-size:14px;padding:11px 5px;background:#e0e9e7;color:#31565a}nav button.active{background:#176b68;color:white}.choice{display:block;width:100%;text-align:left;margin:9px 0;background:#edf4f2;color:#173e42;font-weight:500}.choice.selected{background:#c2e3dc;outline:2px solid #176b68}.pill{display:inline-block;background:#e1efec;color:#176b68;border-radius:20px;padding:5px 10px;font-size:12px}.hidden{display:none}.answer{background:#f1f7f3;border-left:4px solid #176b68;padding:12px;border-radius:7px;margin:12px 0}.bar{height:8px;background:#dfe8e5;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:#176b68}footer{font-size:12px;color:#63767b;text-align:center;padding:18px}small{font-size:12px}#message{position:sticky;top:0;z-index:5;background:#d8eee8;padding:10px;text-align:center;display:none}a{color:#176b68}
</style></head><body><div id="message" role="status"></div><header><div style="max-width:650px;margin:auto"><small>MEMORY LAB · 個人練習版</small><h1>每日記憶訓練</h1><div style="opacity:.8">每天 5–10 分鐘 · 不用登入 · 本機保存</div></div></header><main><nav><button data-tab="today" class="active">今日訓練</button><button data-tab="review">間隔重溫</button><button data-tab="progress">進度與備份</button></nav><div id="view"></div></main><footer>離線題庫版本 1.0 · 資料只保存在目前瀏覽器</footer><script>
'use strict';
const BANK=[
['科學','光由太陽到達地球約需多久？',['8分鐘','8秒','80分鐘'],0,'太陽光到地球約需8分20秒。'],
['地理','世界上面積最大的海洋是？',['太平洋','大西洋','印度洋'],0,'太平洋是面積最大的海洋。'],
['歷史','活字印刷術在中國宋代由誰發明？',['畢昇','蔡倫','張衡'],0,'畢昇發明膠泥活字印刷。'],
['文化','「浮世繪」主要與哪個國家的藝術有關？',['日本','希臘','埃及'],0,'浮世繪是日本的版畫藝術傳統。'],
['自然','章魚有多少顆心臟？',['3顆','1顆','2顆'],0,'章魚有三顆心臟。'],
['生活','水在標準大氣壓下約攝氏多少度沸騰？',['100°C','80°C','120°C'],0,'標準大氣壓下純水沸點約100°C。'],
['語言','「光陰似箭」主要形容甚麼？',['時間過得快','光線很亮','速度很慢'],0,'這個成語形容時間飛逝。'],
['科學','DNA 的主要作用是？',['儲存遺傳資訊','輸送氧氣','消化食物'],0,'DNA承載生物的遺傳資訊。'],
['地理','撒哈拉沙漠主要位於哪一洲？',['非洲','亞洲','南美洲'],0,'撒哈拉沙漠橫跨北非。'],
['歷史','古羅馬的主要語言之一是？',['拉丁語','日語','阿拉伯語'],0,'拉丁語是古羅馬的重要語言。'],
['文化','交響樂團常見的弦樂器是？',['小提琴','長笛','小號'],0,'小提琴屬弦樂器。'],
['自然','植物光合作用主要吸收哪種氣體？',['二氧化碳','氮氣','氦氣'],0,'光合作用吸收二氧化碳，釋放氧氣。'],
['科學','人體負責泵送血液的器官是？',['心臟','肺','胃'],0,'心臟透過收縮推動血液循環。'],
['地理','安第斯山脈位於哪一洲？',['南美洲','歐洲','大洋洲'],0,'安第斯山脈沿南美洲西部延伸。'],
['歷史','金字塔最著名的古文明所在地是？',['埃及','挪威','加拿大'],0,'古埃及留下了著名的吉薩金字塔。'],
['文化','俳句通常與哪種語言的文學傳統有關？',['日語','法語','德語'],0,'俳句源自日本詩歌傳統。'],
['自然','蜜蜂採集花蜜主要用於製作甚麼？',['蜂蜜','奶酪','樹脂'],0,'蜜蜂會將花蜜加工儲存為蜂蜜。'],
['生活','溫度計主要測量甚麼？',['溫度','重量','氣壓'],0,'溫度計用於測量溫度。'],
['科學','聲音在真空中能傳播嗎？',['不能','能','只有低音能'],0,'聲音需要介質傳播。'],
['地理','日本首都是哪個城市？',['東京','大阪','京都'],0,'東京是日本首都。'],
['文化','鋼琴主要透過甚麼發聲？',['琴槌敲擊琴弦','吹氣','拉弓'],0,'鋼琴按鍵帶動琴槌敲擊琴弦。'],
['自然','企鵝主要分布在哪個半球？',['南半球','北半球','只在赤道'],0,'野生企鵝主要分布在南半球。'],
['生活','攝氏0度在標準大氣壓下是純水的甚麼溫度？',['凝固點附近','沸點','燃點'],0,'純水在標準大氣壓下約0°C凝固。'],
['歷史','工業革命最早主要發生在哪個國家？',['英國','巴西','印度'],0,'第一次工業革命最早主要在英國發生。']
];
const KEY='memory-lab-v1';const day=()=>new Date().toLocaleDateString('en-CA');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};if(!state.history)state.history=[];if(!state.cards)state.cards={};if(!state.sessions)state.sessions={};let tab='today',run=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){notify('儲存失敗：請檢查瀏覽器儲存空間');return false}}
function notify(s){const e=document.getElementById('message');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',3500)}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function todayIds(){return BANK.map((_,i)=>i).sort((a,b)=>hash(day()+':'+a)-hash(day()+':'+b)).slice(0,8)}
function dueIds(){return Object.keys(state.cards).map(Number).filter(i=>state.cards[i].due<=day()).sort((a,b)=>state.cards[a].due.localeCompare(state.cards[b].due))}
function schedule(id,correct){let c=state.cards[id]||{interval:0,streak:0};c.streak=correct?c.streak+1:0;c.interval=correct?([1,3,7,14,30][Math.min(c.streak-1,4)]):1;const d=new Date();d.setDate(d.getDate()+c.interval);c.due=d.toLocaleDateString('en-CA');state.cards[id]=c}
function record(id,correct,mode){schedule(id,correct);state.history.push({id,correct,mode,date:day(),at:new Date().toISOString()});save()}
function setTab(t){tab=t;run=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function render(){const v=document.getElementById('view');if(run){renderQuestion(v);return}if(tab==='today'){let completed=!!state.sessions[day()];v.innerHTML=`<section class="card"><div class="row"><h2>今日挑戰</h2><span class="pill">${esc(day())}</span></div><p class="muted">8 題不同領域的知識記憶與測試。完成後可查看答案和解釋。</p><div class="stats"><div class="stat"><b>${state.history.filter(x=>x.date===day()).length}</b><span>今日答題</span></div><div class="stat"><b>${dueIds().length}</b><span>待重溫</span></div><div class="stat"><b>${Object.keys(state.sessions).length}</b><span>訓練日數</span></div></div><p>${completed?'今日已完成：'+state.sessions[day()].score+'/8 題正確':'今天尚未完成每日挑戰。'}</p><button id="start">${completed?'重新練習今日題目':'開始今日挑戰'}</button></section><section class="card"><h2>訓練方法</h2><p>先閱讀知識提示，按「開始測試」後隱藏提示，再從選項中提取記憶。答錯的題目會安排翌日重溫。</p><p class="muted">目前是24題內建離線題庫；不同日期會輪換題目，並非每日自動從網上更新。</p></section>`;document.getElementById('start').onclick=()=>start('daily',todayIds());}
else if(tab==='review'){let ids=dueIds();v.innerHTML=`<section class="card"><h2>間隔重溫</h2><p class="muted">答對後逐步延長重溫間隔（1、3、7、14、30日）；答錯則翌日再練。</p><p>目前有 <b>${ids.length}</b> 題到期。</p><button id="start" ${ids.length?'':'disabled'}>開始重溫</button></section>`;document.getElementById('start').onclick=()=>start('review',ids);}
else{let h=state.history,ok=h.filter(x=>x.correct).length,days=Object.keys(state.sessions).sort().reverse();v.innerHTML=`<section class="card"><h2>訓練進度</h2><div class="stats"><div class="stat"><b>${days.length}</b><span>完成日數</span></div><div class="stat"><b>${h.length}</b><span>累計作答</span></div><div class="stat"><b>${h.length?Math.round(ok/h.length*100):0}%</b><span>總正確率</span></div></div><h2 style="margin-top:20px">最近完成紀錄</h2>${days.length?days.slice(0,15).map(d=>`<p class="row"><span>${esc(d)}</span><b>${state.sessions[d].score}/8</b></p>`).join(''):'<p class="muted">尚未有完成紀錄。</p>'}</section><section class="card"><h2>備份及恢復</h2><p class="muted">匯出 JSON 備份到 iPhone「檔案」或 iCloud Drive。恢復時會覆蓋目前所有記錄，請先匯出現有資料。</p><div class="row" style="flex-wrap:wrap"><button id="export">匯出備份</button><button class="secondary" id="import">匯入恢復</button><input id="file" type="file" accept="application/json,.json" class="hidden"></div><p class="muted">建議每週備份一次。Safari 清除網站資料或更換網址，可能令本機紀錄消失。</p></section>`;document.getElementById('export').onclick=exportData;document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=importData;}}
function start(mode,ids){if(!ids.length)return;run={mode,ids,index:0,score:0,phase:'study',selected:null};render()}
function renderQuestion(v){let r=run;if(r.index>=r.ids.length){if(r.mode==='daily'){state.sessions[day()]={score:r.score,total:r.ids.length};save()}v.innerHTML=`<section class="card"><h2>完成訓練</h2><p style="font-size:32px;font-weight:700">${r.score} / ${r.ids.length}</p><p>答錯題目已排入重溫計劃。</p><button id="finish">返回主頁</button></section>`;document.getElementById('finish').onclick=()=>{run=null;render()};return}
let id=r.ids[r.index],q=BANK[id];let opts=q[2].map((x,i)=>({x,i})).sort((a,b)=>hash(day()+id+':'+a.i)-hash(day()+id+':'+b.i));let pct=Math.round(r.index/r.ids.length*100);
v.innerHTML=`<section class="card"><div class="row"><span class="pill">${esc(q[0])} · ${r.mode==='daily'?'每日挑戰':'重溫'}</span><small>${r.index+1}/${r.ids.length}</small></div><div class="bar" style="margin:15px 0"><div style="width:${pct}%"></div></div>${r.phase==='study'?`<h2>先記住這個知識</h2><p style="font-size:19px">${esc(q[4])}</p><p class="muted">記住後按下面的按鈕，提示會被隱藏。</p><button id="go">開始測試</button>`:`<h2>${esc(q[1])}</h2>${opts.map(o=>`<button class="choice ${r.selected===o.i?'selected':''}" data-answer="${o.i}" ${r.phase==='result'?'disabled':''}>${esc(o.x)}</button>`).join('')}${r.phase==='result'?`<div class="answer"><b>${r.selected===q[3]?'答對了':'正確答案：'+esc(q[2][q[3]])}</b><p>${esc(q[4])}</p></div><button id="next">${r.index+1===r.ids.length?'查看結果':'下一題'}</button>`:''}`}</section>`;
if(r.phase==='study')document.getElementById('go').onclick=()=>{r.phase='test';render()};if(r.phase==='test')v.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{r.selected=Number(b.dataset.answer);let correct=r.selected===q[3];if(correct)r.score++;record(id,correct,r.mode);r.phase='result';render()});if(r.phase==='result')document.getElementById('next').onclick=()=>{r.index++;r.phase='study';r.selected=null;render()};}
function exportData(){let blob=new Blob([JSON.stringify({app:'Memory Lab',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='memory-lab-backup-'+day()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);notify('已產生備份檔案，請保存到「檔案」或 iCloud Drive')}
async function importData(e){let f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('檔案過大');let obj=JSON.parse(await f.text());if(obj.app!=='Memory Lab'||obj.version!==1||!obj.data||!Array.isArray(obj.data.history)||typeof obj.data.cards!=='object'||!obj.data.cards||typeof obj.data.sessions!=='object'||!obj.data.sessions)throw Error('備份格式不正確');if(!confirm('恢復備份會覆蓋目前所有訓練紀錄。確定繼續？'))return;state={history:obj.data.history,cards:obj.data.cards,sessions:obj.data.sessions};if(!save())return;notify('恢復完成');render()}catch(err){notify('無法恢復：'+err.message)}finally{e.target.value=''}}
render();
</script></body></html>
